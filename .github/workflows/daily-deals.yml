name: Daily Furniture Deal Hunt

on:
  schedule:
    # Runs at 9pm UTC = 7am AEST (Sydney time) every day
    - cron: '0 21 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  deal-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Create output directory
        run: mkdir -p output

      - name: Run Claude Code Deal Hunt
        run: claude -p "$(cat PROMPT.md)" --dangerously-skip-permissions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        timeout-minutes: 25

      - name: Read subject line
        id: subject
        run: |
          SUBJECT=$(cat output/subject.txt 2>/dev/null || echo "🏠 Daily Furniture Deals - $(date '+%d %B %Y')")
          echo "line=$SUBJECT" >> $GITHUB_OUTPUT

      - name: Send email via Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.subject.outputs.line }}
          to: sachin.imt@gmail.com
          from: "Furniture Deal Hunter <${{ secrets.GMAIL_USERNAME }}>"
          html_body: file://output/email.html
          convert_markdown: false

      - name: Commit deal report to repo
        run: |
          git config user.name "Deal Hunter Bot"
          git config user.email "actions@github.com"
          DATE=$(date '+%Y-%m-%d')
          mkdir -p archive
          cp output/email.html archive/deals-$DATE.html 2>/dev/null || true
          git add archive/ output/
          git diff --cached --quiet || git commit -m "Deal report $DATE"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
