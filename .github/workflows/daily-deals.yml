name: Daily Furniture Deal Hunt

on:
  schedule:
    # Runs at 9pm UTC = 7am AEST (Sydney time) every day
    - cron: '0 21 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  deal-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Create output directory
        run: mkdir -p output

      - name: Run Claude Code Deal Hunt
        run: claude -p "$(cat PROMPT.md)" --dangerously-skip-permissions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        timeout-minutes: 25

      - name: Send email via Gmail
        run: python3 send_email.py
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Commit deal report to repo
        run: |
          git config user.name "Deal Hunter Bot"
          git config user.email "actions@github.com"
          DATE=$(date '+%Y-%m-%d')
          mkdir -p archive
          cp output/email.html archive/deals-$DATE.html 2>/dev/null || true
          git add archive/ output/
          git diff --cached --quiet || git commit -m "Deal report $DATE"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
